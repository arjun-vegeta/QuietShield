const po = []
try { new PerformanceObserver(l => { for (const e of l.getEntries()) po.push(e.name) }).observe({ type: 'resource', buffered: true }) } catch (e) {}
const g = document.createElement('script')
g.src = 'https://securepubads.g.doubleclick.net/tag/js/gpt.js'
g.onload = () => {
  R.gpt = 'loaded'

}
g.onerror = () => { R.gpt = 'error' }
document.head.appendChild(g)
const a = document.createElement('script')
a.src = 'https://www.google-analytics.com/analytics.js'
a.onload = () => {

  try { ga(function () { R.gaCbFrames = frameOf(new Error().stack) }) } catch (e) { R.gaErr = String(e) }
}
a.onerror = () => { R.ga = 'error' }
document.head.appendChild(a)
setTimeout(() => {
  const ents = performance.getEntriesByType('resource')
  const pick = (needle) => { const e = ents.find(x => x.name.includes(needle)); return e ? { name: e.name, initiatorType: e.initiatorType, responseStatus: e.responseStatus, transferSize: e.transferSize, encodedBodySize: e.encodedBodySize, decodedBodySize: e.decodedBodySize, duration: Math.round(e.duration), nextHopProtocol: e.nextHopProtocol, deliveryType: e.deliveryType, contentType: e.contentType, renderBlockingStatus: e.renderBlockingStatus, redirectStart: e.redirectStart, fetchStart: Math.round(e.fetchStart), responseEnd: Math.round(e.responseEnd) } : null }
  R.rtGpt = pick('gpt.js'); R.rtGa = pick('analytics.js')
  R.rtAll = ents.map(e => e.name)
  R.poNames = po
  R.adopted = document.adoptedStyleSheets.length
  R.adoptedRules = [...document.adoptedStyleSheets].map(s => s.cssRules.length)
  R.adoptedSample = [...document.adoptedStyleSheets].flatMap(s => [...s.cssRules].slice(0, 2).map(r => r.cssText.slice(0, 120)))
  R.done = true

</script>
