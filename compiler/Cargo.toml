[package]
name = "shields-compiler"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Compiles Brave's filter lists with adblock-rust into Chrome MV3 declarativeNetRequest rules, cosmetic data and scriptlet bundles"

[dependencies]
adblock = { path = "../vendor/adblock-rust", features = ["css-validation", "resource-assembler"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
regex = "1"
