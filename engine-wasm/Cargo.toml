[package]
name = "shields-engine-wasm"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Brave's adblock-rust engine compiled to WebAssembly for an MV3 service worker"

[lib]
crate-type = ["cdylib"]

[dependencies]
adblock = { path = "../vendor/adblock-rust", features = ["css-validation"] }
wasm-bindgen = "=0.2.129"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
